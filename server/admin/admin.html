<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Модерация — Бессмертная память</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header>
    <h1>Модерация — «Бессмертная память»</h1>
    <div id="head-right" class="head-right"></div>
  </header>

  <div id="login" class="login-box" style="display:none;">
    <h2>Вход администратора</h2>
    <form id="login-form">
      <label for="pass">Пароль</label>
      <input type="password" id="pass" placeholder="Пароль администратора" autocomplete="current-password">
      <div id="login-err" class="login-err"></div>
      <button id="login-btn" type="submit" style="width:100%;">Войти</button>
    </form>
  </div>

  <main id="panel" class="wrap" style="display:none;">
    <div class="tabs">
      <button id="tab-pending" class="on">Фото: на модерации</button>
      <button id="tab-approved">Фото: одобренные</button>
      <button id="tab-rejected">Фото: отклонённые</button>
      <button id="tab-wall">Стена памяти</button>
      <button id="tab-monuments">Памятники</button>
    </div>
    <div id="list"></div>
  </main>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
