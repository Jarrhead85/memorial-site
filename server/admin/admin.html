<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Модерация фото — Бессмертная память</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: #0a0a0f;
    color: #e8e6e3;
  }
  header {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid #2a2a3a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0;
    color: #c9a84c;
    font-weight: 600;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
  .login-box {
    max-width: 360px;
    margin: 80px auto;
    background: #16161f;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 1.5rem;
  }
  label { display: block; font-size: 0.85rem; color: #8a8a9a; margin-bottom: 0.4rem; }
  input[type=password] {
    width: 100%;
    padding: 0.6rem 0.8rem;
    background: #0a0a0f;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    color: #e8e6e3;
    margin-bottom: 1rem;
    font-size: 0.95rem;
  }
  input[type=password]:focus { outline: none; border-color: #c9a84c; }
  button {
    background: #c9a84c;
    color: #14100a;
    border: none;
    border-radius: 8px;
    padding: 0.55rem 1.1rem;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
  }
  button.secondary { background: #2a2a3a; color: #e8e6e3; }
  button.reject { background: #7f1d1d; color: #e8e6e3; }
  button:disabled { opacity: 0.5; cursor: default; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .tabs button.on { background: #c9a84c; color: #14100a; }
  .tabs button { background: transparent; border: 1px solid #2a2a3a; color: #8a8a9a; }
  .card {
    background: #16161f;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 1rem;
    align-items: start;
  }
  .card img {
    width: 160px;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    background: #0a0a0f;
    border: 1px solid #2a2a3a;
  }
  .meta { display: flex; gap: 1.5rem; font-size: 0.8rem; color: #8a8a9a; margin-bottom: 0.4rem; flex-wrap: wrap; }
  .meta b { color: #e8e6e3; font-weight: 600; }
  .title { font-size: 1.05rem; margin: 0 0 0.4rem 0; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { color: #c9a84c; }
  .url-row { font-size: 0.82rem; word-break: break-all; margin-bottom: 0.4rem; }
  .url-row a { color: #c9a84c; text-decoration: none; }
  .url-row a:hover { text-decoration: underline; }
  .comment { font-size: 0.88rem; color: #8a8a9a; margin-bottom: 0.75rem; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .empty { color: #8a8a9a; text-align: center; padding: 3rem 0; }
  .badge { font-size: 0.7rem; padding: 0.15rem 0.5rem; border-radius: 20px; border: 1px solid #2a2a3a; }
  .badge.approved { color: #4ade80; border-color: rgba(74,222,128,0.3); }
  .badge.rejected { color: #f87171; border-color: rgba(248,113,113,0.3); }
  .badge.pending { color: #fbbf24; border-color: rgba(251,191,36,0.3); }
  .status { font-size: 0.78rem; color: #8a8a9a; }
  @media (max-width: 600px) {
    .card { grid-template-columns: 1fr; }
    .card img { width: 100%; height: auto; max-height: 200px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Модерация фото — «Бессмертная память»</h1>
    <div id="head-right" style="display:flex;gap:0.5rem;align-items:center;"></div>
  </header>

  <div id="login" class="login-box" style="display:none;">
    <h2 style="font-size:1.05rem;margin-top:0;color:#e8e6e3;">Вход администратора</h2>
    <form id="login-form">
      <label for="pass">Пароль</label>
      <input type="password" id="pass" placeholder="Пароль из server/config.json" autocomplete="current-password">
      <div id="login-err" style="color:#f87171;font-size:0.85rem;margin-bottom:0.75rem;"></div>
      <button id="login-btn" type="submit" style="width:100%;">Войти</button>
    </form>
  </div>

  <main id="panel" class="wrap" style="display:none;">
    <div class="tabs">
      <button id="tab-pending" class="on">Фото: на модерации</button>
      <button id="tab-approved">Фото: одобренные</button>
      <button id="tab-rejected">Фото: отклонённые</button>
      <button id="tab-wall">Стена памяти</button>
      <button id="tab-monuments">Памятники</button>
    </div>
    <div id="list"></div>
  </main>

<script>
const $ = (id) => document.getElementById(id)
let token = localStorage.getItem('memorial-admin-token') || ''

const state = { tab: 'pending', photos: [], wall: [], suggests: [], monuments: new Map() }

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) }
  if (token) headers['Authorization'] = 'Bearer ' + token
  const r = await fetch(path, { ...opts, headers })
  if (r.status === 401) { logout(); throw new Error('unauthorized') }
  return r.json()
}

function logout() {
  token = ''
  localStorage.removeItem('memorial-admin-token')
  showLogin()
}

function showLogin() {
  $('panel').style.display = 'none'
  $('login').style.display = 'block'
  $('head-right').innerHTML = ''
  setTimeout(() => $('pass').focus(), 50)
}

function showPanel() {
  $('login').style.display = 'none'
  $('panel').style.display = 'block'
  const b = document.createElement('button')
  b.className = 'secondary'
  b.textContent = 'Выйти'
  b.onclick = logout
  $('head-right').innerHTML = ''
  $('head-right').appendChild(b)
  load()
}

async function loadMonuments() {
  if (state.monuments.size) return
  try {
    const res = await fetch('/api/monuments')
    const data = await res.json()
    state.monuments = new Map((data.monuments || []).map((m) => [m.id, m]))
  } catch { state.monuments = new Map() }
}

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault()
  $('login-err').textContent = ''
  try {
    const res = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: $('pass').value }) })
    if (res.ok) {
      token = res.token
      localStorage.setItem('memorial-admin-token', token)
      showPanel()
    } else {
      $('login-err').textContent = res.error || 'Ошибка входа'
    }
  } catch (e) {
    if (e.message !== 'unauthorized') $('login-err').textContent = 'Сервер недоступен'
  }
})

async function load() {
  try {
    const res = await api('/api/admin/photos')
    state.photos = res.photos || []
  } catch { state.photos = [] }
  await loadMonuments()
  render()
}

async function loadWall() {
  try {
    const res = await api('/api/admin/wall')
    state.wall = res.entries || []
  } catch { state.wall = [] }
  await loadMonuments()
  renderWall()
}

$('tab-pending').onclick = () => { state.tab = 'pending'; setTab(); render() }
$('tab-approved').onclick = () => { state.tab = 'approved'; setTab(); render() }
$('tab-rejected').onclick = () => { state.tab = 'rejected'; setTab(); render() }
$('tab-wall').onclick = () => { state.tab = 'wall'; setTab(); loadWall() }
$('tab-monuments').onclick = () => { state.tab = 'monuments'; setTab(); loadSuggests() }

function setTab() {
  $('tab-pending').classList.toggle('on', state.tab === 'pending')
  $('tab-approved').classList.toggle('on', state.tab === 'approved')
  $('tab-rejected').classList.toggle('on', state.tab === 'rejected')
  $('tab-wall').classList.toggle('on', state.tab === 'wall')
  $('tab-monuments').classList.toggle('on', state.tab === 'monuments')
}

async function moderate(id, action) {
  await api(`/api/admin/photos/${id}/${action}`, { method: 'POST', body: '{}' })
  load()
}

async function moderateWall(id, action) {
  await api(`/api/admin/wall/${id}/${action}`, { method: 'POST', body: '{}' })
  loadWall()
}

async function loadSuggests() {
  try {
    const res = await api('/api/admin/monuments')
    state.suggests = res.entries || []
  } catch { state.suggests = [] }
  renderSuggests()
}

async function moderateSuggest(id, action) {
  const b = document.querySelector(`#sug-${id} button`)
  if (b) { b.disabled = true; b.textContent = action === 'approve' ? 'Добавляем…' : '…' }
  await api(`/api/admin/monuments/${id}/${action}`, { method: 'POST', body: '{}' })
  loadSuggests()
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

function monumentLink(id) {
  const m = state.monuments.get(id)
  return m ? m.title : `Памятник #${id}`
}

function renderWall() {
  const list = state.wall
  const el = $('list')
  if (!list.length) {
    el.innerHTML = '<div class="empty">На стене памяти пока нет записей</div>'
    return
  }
  el.innerHTML = list.map((w) => {
    const m = state.monuments.get(w.monumentId)
    const mName = m ? esc(m.title) : `Памятник #${w.monumentId}`
    const mCity = m ? `${esc(m.city)}` : ''
    const date = esc((w.createdAt || '').replace('T', ' ').slice(0, 16))
    return `
    <div class="card" id="wall-${w.id}">
      <div style="min-width:0;">
        <h3 class="title">${mName}</h3>
        ${mCity ? `<div class="url-row">${mCity}</div>` : ''}
        <div class="meta"><span><b>${esc(w.name)}</b> · ${date}</span>
        <span class="badge ${esc(w.status)}">${esc(w.status)}</span></div>
        <div class="comment">«${esc(w.text)}»</div>
        ${w.status === 'pending' ? `
          <div class="actions">
            <button onclick="moderateWall(${w.id},'approve')">Опубликовать</button>
            <button class="reject" onclick="moderateWall(${w.id},'reject')">Отклонить</button>
          </div>` : `<div class="status">ID: ${w.id} &middot; статус: ${esc(w.status)}</div>`}
      </div>
    </div>`
  }).join('')
}

function render() {
  const list = state.photos.filter((p) => p.status === state.tab)
  const el = $('list')
  if (!list.length) {
    el.innerHTML = '<div class="empty">Нет записей</div>'
    return
  }
  el.innerHTML = list.map((p) => {
    const m = state.monuments.get(p.monumentId)
    const mName = m ? esc(m.title) : `Памятник #${p.monumentId}`
    const mCity = m ? `${esc(m.city)} · ${esc(m.region)}` : ''
    return `
    <div class="card" id="photo-${p.id}">
      <img src="${esc(p.url)}" alt="" onerror="this.style.opacity='0.25'">
      <div>
        <h3 class="title">${mName}</h3>
        ${mCity ? `<div class="url-row">${mCity}</div>` : ''}
        <div class="meta">
          <span>ID заявки: <b>${p.id}</b></span>
          <span>Статус: <span class="badge ${esc(p.status)}">${esc(p.status)}</span></span>
          <span>${esc((p.submittedAt || '').replace('T', ' ').slice(0, 16))}</span>
        </div>
        <div class="url-row"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url)}</a></div>
        ${p.source ? `<div class="url-row">Источник: ${esc(p.source)} ${p.sourceUrl ? `<a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">(ссылка)</a>` : ''}</div>` : ''}
        ${p.comment ? `<div class="comment">Комментарий: ${esc(p.comment)}</div>` : ''}
        ${p.status === 'pending' ? `
          <div class="actions">
            <button onclick="moderate(${p.id},'approve')">Принять</button>
            <button class="reject" onclick="moderate(${p.id},'reject')">Отклонить</button>
          </div>` : `<div class="status">ID: ${p.id} &middot; статус: ${esc(p.status)}</div>`}
      </div>
    </div>`
  }).join('')
}

function renderSuggests() {
  const list = state.suggests
  const el = $('list')
  if (!list.length) {
    el.innerHTML = '<div class="empty">Заявок на памятники пока нет</div>'
    return
  }
  el.innerHTML = list.map((s) => {
    const date = esc((s.createdAt || '').replace('T', ' ').slice(0, 16))
    const dup = s.duplicateOf ? `<div class="meta" style="color:#f8b4b4;">⚠ возможно дубль памятника #${esc(String(s.duplicateOf))}</div>` : ''
    const src = s.sourceUrl ? `<a href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">источник</a>` : ''
    return `
    <div class="card" id="sug-${s.id}">
      <img src="${esc(s.photoUrl)}" alt="" onerror="this.style.opacity='0.25'">
      <div style="min-width:0;">
        <h3 class="title">${esc(s.title)}</h3>
        <div class="url-row">${esc(s.city)}${s.region && s.region !== '—' ? ' · ' + esc(s.region) : ''}${s.year ? ' · ' + esc(String(s.year)) : ''} · ${esc(s.category)}</div>
        ${dup}
        <div class="meta"><span>Автор: <b>${esc(s.authorName)}</b> · ${date}</span>
        <span class="badge ${esc(s.status)}">${esc(s.status)}</span></div>
        <div class="comment">«${esc(s.description.slice(0, 400))}${s.description.length > 400 ? '…' : ''}»</div>
        <div class="url-row">Координаты: ${esc(String(s.lat))}, ${esc(String(s.lng))} · <a href="https://www.openstreetmap.org/?mlat=${encodeURIComponent(String(s.lat))}&mlon=${encodeURIComponent(String(s.lng))}#map=17/${encodeURIComponent(String(s.lat))}/${encodeURIComponent(String(s.lng))}" target="_blank" rel="noopener">на карте</a> ${src}</div>
        ${s.status === 'pending' ? `
          <div class="actions">
            <button onclick="moderateSuggest(${s.id},'approve')">Одобрить и добавить</button>
            <button class="reject" onclick="moderateSuggest(${s.id},'reject')">Отклонить</button>
          </div>` : `<div class="status">ID: ${s.id} &middot; статус: ${esc(s.status)}</div>`}
      </div>
    </div>`
  }).join('')
}

// Проверяем сохранённый токен реальным запросом, а не логином с пустым паролем
if (token) {
  api('/api/admin/photos')
    .then(() => showPanel())
    .catch(() => showLogin())
} else {
  showLogin()
}
</script>
</body>
</html>
